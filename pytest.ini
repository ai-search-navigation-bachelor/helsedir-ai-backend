[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Pure unit tests — no I/O, no DB, no ML models required
    integration: Tests that spin up the FastAPI app (still mocked I/O)
    slow: Tests that are slow and can be skipped in fast CI runs

addopts = -v --tb=short -p no:warnings
