services:
  db:
    image: mysql:8
    container_name: helsedir-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helsedir_ai}
      MYSQL_USER: ${MYSQL_USER:-helsedir}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-helsedir}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup/init_database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helsedir-ai-backend
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
    volumes:
      - /data/helsedir-backend/app-data:/app/data
      - /data/helsedir-backend/models:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: helsedir-ai-backend_mysql_data
